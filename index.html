<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geografski kviz — Jugoistočna Europa</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar card">
        <div>
          <h1>Geografski kviz</h1>
          <p>Jugoistočna Europa • 15 nasumičnih pitanja</p>
        </div>
        <div class="controls">
          <label>
            <span>Paleta</span>
            <select id="paletteSelect" aria-label="Odabir palete boja">
              <option value="sunset">Sunset</option>
              <option value="earth">Earth</option>
              <option value="adriatic">Adriatic</option>
            </select>
          </label>
          <button id="modeToggle" class="btn ghost" type="button">🌙 Tamni način</button>
        </div>
      </header>

      <section class="card progress-wrap">
        <div class="progress-meta">
          <span id="progressText">Pitanje 1/15</span>
          <span id="scoreText">Bodovi: 0</span>
        </div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </section>

      <section id="quizCard" class="card quiz-card">
        <h2 id="questionText"></h2>
        <div id="answers" class="answers"></div>
      </section>

      <section id="feedbackCard" class="card feedback" hidden>
        <h3 id="resultTitle"></h3>
        <p><strong>Točan odgovor:</strong> <span id="correctShort"></span></p>
        <p><strong>Objašnjenje:</strong></p>
        <p id="explanationText"></p>
        <button id="nextBtn" class="btn" type="button">Dalje</button>
      </section>

      <section id="finalCard" class="card final" hidden>
        <h2>Gotovo!</h2>
        <p id="finalText"></p>
        <button id="restartBtn" class="btn" type="button">Novi krug</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
